name: Publish demo page
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/static-web-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SC500_STATIC_WEB_APP_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
